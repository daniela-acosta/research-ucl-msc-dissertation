<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Demographics</title>
  <link rel="stylesheet" href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css">
  <link rel="stylesheet" href="assets/style.css">
  <script src="jatos.js"></script>
</head>
<body>
  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@1.0.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.2.0"></script>
  <script src="config.js"></script>

  <script>
    jatos.onLoad(function () {
      let exclusionTriggered = false;

      const jsPsych = initJsPsych({
        on_finish: function () {
          if (exclusionTriggered) return;
          const formResponse = jsPsych.data.get().values()[0].response;
          const record = {
            ...formResponse,
            prolific_pid:       jatos.studySessionData[CONFIG.sessionKeys.prolificPID],
            study_id:           jatos.studySessionData[CONFIG.sessionKeys.studyID],
            session_id:         jatos.studySessionData[CONFIG.sessionKeys.sessionID],
            stimulus_config:    jatos.studySessionData[CONFIG.sessionKeys.stimulusConfig],
            stimulus_map:       jatos.studySessionData[CONFIG.sessionKeys.stimulusMap],
            stimulus_type_map:  jatos.studySessionData[CONFIG.sessionKeys.stimulusTypeMap]
          };
          jatos.submitResultData(JSON.stringify(record), jatos.startNextComponent);
        }
      });

      const timeline = [
        {
          type: jsPsychSurveyHtmlForm,
          preamble: '<h2 style="text-align:left; margin-bottom:24px;">Tell us about you</h2>',
          html: `
            <div class="demo-form">

              <!-- Age -->
              <div class="demo-field">
                <label class="demo-label">Age</label>
                <input name="age" type="number" min="18" max="99"
                       placeholder="Enter your age" required />
              </div>

              <!-- Gender -->
              <div class="demo-field">
                <label class="demo-label">Gender</label>
                <div class="demo-options">
                  <label class="demo-option">
                    <input type="radio" name="gender" value="female" required /> Female
                  </label>
                  <label class="demo-option">
                    <input type="radio" name="gender" value="male" /> Male
                  </label>
                  <label class="demo-option">
                    <input type="radio" name="gender" value="non-binary" /> Non-binary
                  </label>
                  <label class="demo-option">
                    <input type="radio" name="gender" value="self-describe" />
                    Prefer to self-describe
                  </label>
                  <label class="demo-option">
                    <input type="radio" name="gender" value="prefer-not" />
                    Prefer not to say
                  </label>
                </div>
              </div>
              <div class="demo-field" id="gender-self-describe" style="display:none;">
                <label class="demo-label">Please describe your gender</label>
                <input name="gender_description" type="text" placeholder="Your description" />
              </div>

              <!-- Handedness -->
              <div class="demo-field">
                <label class="demo-label">Handedness</label>
                <div class="demo-options">
                  <label class="demo-option">
                    <input type="radio" name="handedness" value="right" required /> Right
                  </label>
                  <label class="demo-option">
                    <input type="radio" name="handedness" value="left" /> Left
                  </label>
                  <label class="demo-option">
                    <input type="radio" name="handedness" value="ambidextrous" /> Ambidextrous
                  </label>
                </div>
              </div>

              <!-- Vision -->
              <div class="demo-field">
                <label class="demo-label">Vision</label>
                <div class="demo-options">
                  <label class="demo-option">
                    <input type="radio" name="vision" value="normal" required />
                    Normal vision
                  </label>
                  <label class="demo-option">
                    <input type="radio" name="vision" value="corrected-normal" />
                    Corrected-to-normal (glasses / contact lenses)
                  </label>
                  <label class="demo-option">
                    <input type="radio" name="vision" value="impaired" />
                    Visual impairment (not corrected)
                  </label>
                </div>
              </div>

              <!-- Language — checkboxes feed into a hidden field so the plugin
                   captures a single comma-separated value reliably. -->
              <div class="demo-field">
                <label class="demo-label">
                  Preferred language
                  <span style="font-weight:normal;color:#888;">(select all that apply)</span>
                </label>
                <div class="demo-options">
                  <label class="demo-option">
                    <input type="checkbox" data-lang="english" /> English
                  </label>
                  <label class="demo-option">
                    <input type="checkbox" data-lang="french" /> French
                  </label>
                  <label class="demo-option">
                    <input type="checkbox" data-lang="german" /> German
                  </label>
                  <label class="demo-option">
                    <input type="checkbox" data-lang="italian" /> Italian
                  </label>
                  <label class="demo-option">
                    <input type="checkbox" data-lang="spanish" /> Spanish
                  </label>
                  <label class="demo-option">
                    <input type="checkbox" data-lang="portuguese" /> Portuguese
                  </label>
                  <label class="demo-option">
                    <input type="checkbox" data-lang="arabic" /> Arabic
                  </label>
                  <label class="demo-option">
                    <input type="checkbox" data-lang="mandarin" /> Mandarin
                  </label>
                  <label class="demo-option">
                    <input type="checkbox" data-lang="other" /> Other
                  </label>
                </div>
                <input type="hidden" name="language" id="lang-hidden" value="" />
              </div>

              <!-- Comments -->
              <div class="demo-field">
                <label class="demo-label">
                  Any other comments or questions?
                  <span style="font-weight:normal;color:#888;">(optional)</span>
                </label>
                <textarea name="comments" placeholder="Your comments here…"></textarea>
              </div>

            </div>
          `,
          button_label: 'Submit',
          on_load: function () {
            // Gender self-describe toggle
            document.querySelectorAll('input[name="gender"]').forEach(function (rb) {
              rb.addEventListener('change', function () {
                document.getElementById('gender-self-describe').style.display =
                  this.value === 'self-describe' ? 'block' : 'none';
              });
            });

            // Language checkboxes → hidden field
            function updateLanguages() {
              var checked = Array.from(document.querySelectorAll('input[data-lang]:checked'))
                .map(function (cb) { return cb.dataset.lang; });
              document.getElementById('lang-hidden').value = checked.join(',');
            }
            document.querySelectorAll('input[data-lang]').forEach(function (cb) {
              cb.addEventListener('change', updateLanguages);
            });
          }
        },

        // Shown only if participant reported uncorrected visual impairment.
        {
          timeline: [{
            type: jsPsychHtmlButtonResponse,
            stimulus: `
              <div class="text-content">
                <p>Thank you for your interest in this study.</p>
                <p>Unfortunately, normal or corrected-to-normal vision is required to participate,
                   and you are therefore not eligible to take part.</p>
                <p>Please <strong>return your submission on Prolific</strong> by clicking
                   "Stop without completing" on the Prolific website.</p>
              </div>`,
            choices: ['OK'],
            on_finish: function () {
              exclusionTriggered = true;
              jatos.abortStudy('Participant does not meet vision eligibility criteria.');
              jsPsych.endExperiment();
            }
          }],
          conditional_function: function () {
            const last = jsPsych.data.get().last(1).values()[0];
            return last && last.response && last.response.vision === 'impaired';
          }
        }
      ];

      jsPsych.run(timeline);
    });
  </script>
</body>
</html>
