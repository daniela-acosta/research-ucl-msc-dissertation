<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Main Task</title>
  <link rel="stylesheet" href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css">
  <link rel="stylesheet" href="assets/style.css">
  <script src="jatos.js"></script>
</head>
<body>
  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <script src="https://unpkg.com/@jspsych/plugin-preload@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.2.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-fullscreen@1.2.1"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-slider-response@1.1.3"></script>
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="config.js"></script>
  <script src="components/utils.js"></script>
  <script src="components/learning-phase.js"></script>
  <script src="components/test-phase.js"></script>

  <script>
    jatos.onLoad(async function () {
      const jsPsych = initJsPsych({
        on_finish: function () {
          jatos.submitResultData(jsPsych.data.get().json(), jatos.startNextComponent);
        }
      });

      const stimulusConfig = jatos.studySessionData[CONFIG.sessionKeys.stimulusConfig];

      // Load both CSVs in parallel, then build the question lookup.
      const [table, candidates] = await Promise.all([
        Utils.loadCounterbalancingTable(),
        Utils.loadQuestionCandidates()
      ]);
      const lookup = Utils.buildQuestionLookup(candidates);

      // Collect all image paths assigned to this participant.
      const stimulusImagePaths = CONFIG.nodes.map(n => Utils.getStimulusPath(n));

      const timeline = [
        { type: jsPsychFullscreen, fullscreen_mode: true },
        {
          type: jsPsychPreload,
          images: stimulusImagePaths,
          show_progress_bar: true,
          message: '<p>Loading, please wait…</p>',
          error_message: '<p>Some images failed to load. Please refresh and try again.</p>',
        }
      ];

      // Generate all walks upfront, discarding and retrying any set that fails validation.
      let walks;
      do {
        walks = Array.from({ length: CONFIG.numBlocks }, () =>
          Utils.generateRandomWalk(CONFIG.adjacency, CONFIG.nodes, CONFIG.walkLength)
        );
      } while (!Utils.walksAreValid(walks));

      for (let block = 1; block <= CONFIG.numBlocks; block++) {
        const walk   = walks[block - 1];
        const trials = Utils.getTrialsForBlock(table, block);

        // Store walk sequence in studySessionData for potential later use.
        const sequences = jatos.studySessionData[CONFIG.sessionKeys.walkSequences] || {};
        sequences[block] = walk;
        jatos.studySessionData[CONFIG.sessionKeys.walkSequences] = sequences;

        const learningTrials = LearningPhase.createTimeline({
          walk, jsPsych, block, timed: true, giveFeedback: false, checkExclusion: true, stimulusConfig
        });
        timeline.push(...learningTrials);

        // Brief pause between learning and test phases to prevent key carry-over.
        timeline.push({
          type:           jsPsychHtmlKeyboardResponse,
          stimulus:       '<p style="font-size:1.1em; color:#555;">Get ready for the next section…</p>',
          choices:        'NO_KEYS',
          trial_duration: CONFIG.learningToTestPause
        });

        const testTrials = TestPhase.createTimeline({
          trials, jsPsych, block, timed: true, giveFeedback: false,
          collectConfidence: true, checkExclusion: true, lookup, stimulusConfig
        });
        timeline.push(...testTrials);

        if (block < CONFIG.numBlocks) {
          let breakIntervalId = null;
          timeline.push({
            type: jsPsychHtmlButtonResponse,
            stimulus: `
              <div class="text-content" style="text-align:center;">
                <h2>Block ${block} of ${CONFIG.numBlocks} complete</h2>
                <p>Take a moment to rest if needed. Press <strong>Continue</strong> whenever you feel ready.
                   The study will move on automatically when the timer reaches zero.</p>
                <div id="break-timer" class="break-timer">3:00</div>
              </div>`,
            choices: ['Continue'],
            on_load: function () {
              let remaining = CONFIG.breakDuration;
              const timerEl = document.getElementById('break-timer');

              function formatTime(s) {
                const m   = Math.floor(s / 60);
                const sec = s % 60;
                return m + ':' + (sec < 10 ? '0' : '') + sec;
              }

              breakIntervalId = setInterval(function () {
                remaining--;
                timerEl.textContent = formatTime(remaining);

                // Colour shifts as time runs low
                if (remaining <= 10) {
                  timerEl.style.color = '#E74C3C';
                } else if (remaining <= 30) {
                  timerEl.style.color = '#cc6600';
                }

                // Double beep at each minute mark
                if (remaining === 120 || remaining === 60) {
                  Utils.playBreakMinuteBeep();
                }

                // Short tick for the last 5 seconds
                if (remaining <= 5 && remaining > 0) {
                  Utils.playBreakCountdownBeep();
                }

                // Auto-advance when time is up
                if (remaining <= 0) {
                  clearInterval(breakIntervalId);
                  document.querySelector('.jspsych-btn').click();
                }
              }, 1000);
            },
            on_finish: function () {
              clearInterval(breakIntervalId);
            }
          });
        }
      }

      jsPsych.run(timeline);
    });
  </script>
</body>
</html>
