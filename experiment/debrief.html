<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Debrief</title>
  <link rel="stylesheet" href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css">
  <link rel="stylesheet" href="assets/style.css">
  <script src="jatos.js"></script>
</head>
<body>
  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@1.0.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.2.0"></script>
  <script src="config.js"></script>
  <script src="components/utils.js"></script>

  <script>
    // Builds an SVG graph showing the participant's actual fractal-to-node mapping.
    function buildGraphSVG() {
      const pos = {
        A: [130,130], B: [310,130], C: [130,310], D: [310,310],
        E: [530,130], F: [710,130], G: [530,310], H: [710,310]
      };
      const intraEdges = [
        ['A','B'],['A','C'],['A','D'],['B','C'],['C','D'],
        ['E','F'],['E','H'],['F','G'],['F','H'],['G','H']
      ];
      const crossEdges = [['B','E'],['D','G']];
      const r = 46;

      const line = ([n1,n2], color, dash='') => {
        const [x1,y1] = pos[n1], [x2,y2] = pos[n2];
        return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"
                  stroke="${color}" stroke-width="2.5"
                  ${dash ? `stroke-dasharray="${dash}"` : ''}/>`;
      };

      const defs = '<defs>' +
        Object.keys(pos).map(n =>
          `<clipPath id="dc${n}"><circle cx="${pos[n][0]}" cy="${pos[n][1]}" r="${r-2}"/></clipPath>`
        ).join('') +
      '</defs>';

      const edges =
        intraEdges.map(e => line(e, '#5a5a72')).join('') +
        crossEdges.map(e => line(e, '#c07850', '8 4')).join('');

      const nodes = Object.keys(pos).map(n => {
        const [cx,cy] = pos[n];
        const src = Utils.getStimulusPath(n);
        return `
          <image href="${src}" x="${cx-r+2}" y="${cy-r+2}"
                 width="${(r-2)*2}" height="${(r-2)*2}" clip-path="url(#dc${n})"/>
          <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#4a4a62" stroke-width="2"/>`;
      }).join('');

      return `
        <svg viewBox="0 0 840 420" xmlns="http://www.w3.org/2000/svg"
             style="width:100%;max-width:680px;margin:24px auto;display:block">
          <rect x="55" y="40" width="320" height="320" rx="14"
                fill="#f7f4ff" stroke="#ccc4ee" stroke-width="1.5"/>
          <rect x="465" y="40" width="320" height="320" rx="14"
                fill="#f0f8ff" stroke="#b8d8e8" stroke-width="1.5"/>
          <text x="215" y="30" text-anchor="middle" font-family="Arial,sans-serif"
                font-size="12" letter-spacing="1" fill="#9988bb">GROUP 1</text>
          <text x="625" y="30" text-anchor="middle" font-family="Arial,sans-serif"
                font-size="12" letter-spacing="1" fill="#7799aa">GROUP 2</text>
          ${defs}${edges}${nodes}
        </svg>
        <p style="text-align:center;font-size:13px;color:#999;margin-top:4px">
          — — — connects the two groups
        </p>`;
    }
  </script>

  <script>
    jatos.onLoad(function () {
      const isPreview = jatos.studySessionData.previewMode === true;

      const jsPsych = initJsPsych({
        on_finish: function () {
          if (isPreview) {
            jatos.endStudy();
          } else {
            jatos.endStudyAndRedirect(CONFIG.prolificCompletionURL);
          }
        }
      });

      const timeline = [

        // Awareness questions — all optional, saved immediately before showing the reveal.
        {
          type: jsPsychSurveyHtmlForm,
          preamble: `
            <h2 style="text-align:left; margin-bottom:12px;">A few quick questions</h2>
            <p style="text-align:left; margin-bottom:24px; color:#555;">
              These are optional — answer as much or as little as you like.
            </p>`,
          html: `
            <div class="demo-form">

              <div class="demo-field">
                <label class="demo-label">
                  What do you think the study was measuring or testing?
                </label>
                <textarea name="study_purpose_guess"
                          placeholder="Your answer here…"></textarea>
              </div>

              <div class="demo-field">
                <label class="demo-label">
                  Did you notice if the images were arranged in any way?
                </label>
                <div class="demo-options">
                  <label class="demo-option">
                    <input type="radio" name="noticed_arrangement" value="yes" /> Yes
                  </label>
                  <label class="demo-option">
                    <input type="radio" name="noticed_arrangement" value="no" /> No
                  </label>
                </div>
              </div>

              <div class="demo-field" id="arrangement-description" style="display:none;">
                <label class="demo-label">Please describe what you noticed</label>
                <textarea name="arrangement_description"
                          placeholder="Your answer here…"></textarea>
              </div>

              <div class="demo-field">
                <label class="demo-label">
                  Do you have any other comments or questions?
                </label>
                <textarea name="other_comments"
                          placeholder="Your answer here…"></textarea>
              </div>

            </div>`,
          button_label: 'Continue',
          on_load: function () {
            document.querySelectorAll('input[name="noticed_arrangement"]').forEach(function (rb) {
              rb.addEventListener('change', function () {
                document.getElementById('arrangement-description').style.display =
                  this.value === 'yes' ? 'block' : 'none';
              });
            });
          },
          on_finish: function (data) {
            // Save awareness responses immediately so they are not lost if the
            // participant closes the window before clicking "Finish".
            jatos.submitResultData(JSON.stringify({ debrief_questions: data.response }));
          }
        },

        // Debrief reveal.
        {
          type: jsPsychHtmlButtonResponse,
          stimulus: `
            <div class="text-content">
              <h2>Debrief</h2>
              <p>Thank you for participating in this study. Your responses have been recorded and
                 will be used to understand how implicit learning happens.</p>
              <p>Unknown to you, the shapes you judged were associated with positions in a network
                 with a hidden community structure. Rather than measuring symmetry judgements, we
                 were interested in whether you implicitly learned the statistical patterns of that
                 network — and, if so, at what point that knowledge became conscious.</p>
              <p>The images belonged to two groups. Images within the same group appeared after
                 each other more often, while the dashed line shows the rarer connections between
                 groups. Here is the network your images were arranged in:</p>
            </div>
            ${buildGraphSVG()}
            <div class="text-content" style="margin-top:16px">
              <p>If you have any questions or concerns, please contact the principal researcher
                 Prof. Megan Peters at
                 <a href="mailto:megan.peters@ucl.ac.uk">megan.peters@ucl.ac.uk</a>.</p>
              <p style="margin-top:24px;">Your completion code is:<br>
                 <strong style="font-size:1.3em;letter-spacing:2px;">${CONFIG.completionCodes.complete}</strong><br>
                 <span style="font-size:0.85em;color:#888;">You will be redirected automatically when you click the button below.</span></p>
            </div>`,
          choices: [isPreview ? 'Finish (preview mode)' : 'Finish and claim your reward'],
          on_finish: function () {
            jatos.submitResultData(JSON.stringify({ exit_type: 'completed' }));
          }
        }

      ];

      jsPsych.run(timeline);
    });
  </script>
</body>
</html>
