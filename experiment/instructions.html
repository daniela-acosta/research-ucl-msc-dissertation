<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Instructions</title>
  <link rel="stylesheet" href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css">
  <link rel="stylesheet" href="assets/style.css">
  <script src="jatos.js"></script>
</head>
<body>
  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <script src="https://unpkg.com/@jspsych/plugin-instructions@1.1.4"></script>
  <script src="config.js"></script>

  <script>
    jatos.onLoad(function () {
      const jsPsych = initJsPsych({
        on_finish: function () {
          jatos.startNextComponent();
        }
      });

      // Instructions describe the cover task (symmetry judgement) ONLY.
      // Do NOT mention the graph, communities, or transition structure.

      const pages = [
        `<div class="text-content">
          <h2>Welcome</h2>
          <p>In this study you will view a series of images and make quick judgements about
             each one.</p>
          <p>The study consists of several rounds, each made up of two parts. We will explain
             both before you begin.</p>
          <p>The study takes approximately 35–40 minutes. Please make sure you are in a quiet
             place where you can focus without interruption.</p>
        </div>`,

        `<div class="text-content">
          <h2>Part 1</h2>
          <p>Images will appear on screen one at a time. Your job is to judge whether each
             image is <strong>symmetric</strong>, meaning it looks roughly the same
             on both sides.</p>
          <p>Press <strong>${CONFIG.coverTask.symmetricLabel}</strong> if the image is symmetric.</p>
          <p>Press <strong>${CONFIG.coverTask.notSymmetricLabel}</strong> if it is not symmetric.</p>
          <p>Each image is shown for ${CONFIG.stimulusDuration / 1000} seconds. Try to respond
             before it disappears. Respond as quickly and accurately as you can.</p>
        </div>`,

        `<div class="text-content">
          <h2>Part 2</h2>
          <p>At the end of each round you will be shown a series of choice questions. Each
             question shows one image at the top and two images below it. Your job is to judge
             <strong>which of the two lower images is more likely to have appeared after the
             top image</strong> during the sequence you just viewed.</p>
          <p><strong>Click</strong> the image you choose. You have
             ${CONFIG.testMaxResponseTime / 1000} seconds to respond. If no response is given
             in time, the question will move on automatically and count as a missed response.</p>
          <p>After each choice you will be asked to rate how confident you felt on a slider
             from <em>totally guessing</em> to <em>completely confident</em>. You have
             ${CONFIG.confidence.maxResponseTime / 1000} seconds to move the slider.
             If no rating is given in time, the confidence question will be skipped.</p>
        </div>`,

        `<div class="text-content">
          <h2>Audio</h2>
          <p>This study includes optional audio feedback. We recommend using speakers or
             headphones for the best experience, but the study works fine without sound.</p>
        </div>`,

        `<div class="text-content">
          <h2>Important: staying in the study</h2>
          <p>It is important that you respond on every trial. The study monitors your
             response rate throughout.</p>
          <p>If you miss <strong>${CONFIG.exclusion.learning.maxConsecutiveMisses} or more
             responses in a row</strong>, or <strong>more than
             ${Math.round(CONFIG.exclusion.learning.maxMissRatePerBlock * 100)}% of responses
             in a single round</strong>, you will receive a warning on screen. If misses
             continue after the warning, the study will end automatically and you will not
             be able to complete it.</p>
          <p>Please make sure you are in a quiet place with no distractions, and respond on
             every trial, even if you are unsure.</p>
        </div>`,

        `<div class="text-content">
          <h2>Ready to begin?</h2>
          <p>You will now complete a short practice round to get familiar with both tasks.
             The practice uses different images than the main study and your responses
             during practice are <strong>not recorded or analyzed</strong>.</p>
          <p>Before the main study begins, you will answer two short questions to check you
             have understood both tasks. You will have two attempts at each. If you are unable
             to answer both correctly, the study will end and you will need to return your
             submission on Prolific.</p>
          <p>You will receive feedback during practice. The main study will begin once the
             practice is complete.</p>
          <p>Click <strong>Next</strong> when you are ready.</p>
        </div>`
      ];

      const timeline = [
        {
          type: jsPsychInstructions,
          pages: pages,
          show_clickable_nav: true,
          button_label_previous: 'Back',
          button_label_next: 'Next'
        }
      ];

      jsPsych.run(timeline);
    });
  </script>
</body>
</html>
