<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Practice</title>
  <link rel="stylesheet" href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css">
  <link rel="stylesheet" href="assets/style.css">
  <script src="jatos.js"></script>
</head>
<body>
  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <script src="https://unpkg.com/@jspsych/plugin-preload@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.2.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-fullscreen@1.2.1"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-slider-response@1.1.3"></script>
  <script src="config.js"></script>
  <script src="components/utils.js"></script>
  <script src="components/learning-phase.js"></script>
  <script src="components/test-phase.js"></script>

  <script>
    // Prevent the browser back button from restarting the practice.
    history.pushState(null, null, location.href);
    window.addEventListener('popstate', function () {
      history.pushState(null, null, location.href);
    });
  </script>

  <script>
    jatos.onLoad(function () {
      const jsPsych = initJsPsych({
        on_finish: function () {
          jatos.startNextComponent();
        }
      });

      const practiceWalk = Utils.generatePracticeWalk(CONFIG.practiceWalkLength);

      // ── Comprehension-check builder ─────────────────────────────────────────
      // Returns { nodes: [...], passed: () => bool }
      // nodes: a loop node (up to 2 attempts) + a conditional reveal node.
      // passed() can be read by later code to check the outcome.
      //
      // onBothFailed (optional): called after 2nd failed attempt. Use to abort
      // the study when a second check also fails.
      function buildCheck({ questionHtml, choices, correctIndex, revealHtml, onBothFailed, canReveal = null }) {
        let attempts = 0;
        let _passed  = false;

        const attemptTrial = {
          type:     jsPsychHtmlButtonResponse,
          stimulus: questionHtml,
          choices:  choices,
          on_finish: function (data) {
            attempts++;
            _passed = (data.response === correctIndex);
            if (!_passed && attempts >= 2 && onBothFailed) {
              onBothFailed();
            }
          }
        };

        // Show "not quite, try again" between attempt 1 and attempt 2 only.
        const incorrectFeedback = {
          timeline: [{
            type:           jsPsychHtmlKeyboardResponse,
            stimulus:       '<p class="feedback-incorrect">Not quite. Please try again.</p>',
            choices:        'NO_KEYS',
            trial_duration: 1000
          }],
          conditional_function: function () {
            return !_passed && attempts < 2;
          }
        };

        const loopNode = {
          timeline:      [attemptTrial, incorrectFeedback],
          loop_function: function () { return !_passed && attempts < 2; }
        };

        // Brief "Correct!" confirmation shown when the participant answers correctly.
        const correctFeedback = {
          timeline: [{
            type:           jsPsychHtmlKeyboardResponse,
            stimulus:       '<p class="feedback-correct">Correct!</p>',
            choices:        'NO_KEYS',
            trial_duration: 800
          }],
          conditional_function: function () { return _passed; }
        };

        // Reveal the correct answer only if both attempts failed and canReveal allows it.
        const revealNode = {
          timeline: [{
            type:     jsPsychHtmlButtonResponse,
            stimulus: revealHtml,
            choices:  ['OK, I understand']
          }],
          conditional_function: function () {
            return !_passed && (!canReveal || canReveal());
          }
        };

        return {
          nodes:  [loopNode, correctFeedback, revealNode],
          passed: function () { return _passed; }
        };
      }

      // ── Build timeline ──────────────────────────────────────────────────────
      // Fullscreen and comprehension checks run once only — they sit outside the
      // repeat loop so closure state doesn't need to reset between repeats.
      let shouldAbort = false;
      const practiceImagePaths = CONFIG.practiceNodes.map(n => Utils.getStimulusPath(n));

      const timeline = [
        { type: jsPsychFullscreen, fullscreen_mode: true },
        {
          type: jsPsychPreload,
          images: practiceImagePaths,
          show_progress_bar: true,
          message: '<p>Loading, please wait…</p>',
          error_message: '<p>Some images failed to load. Please refresh and try again.</p>',
        }
      ];

      // ── Step 1: Cover task comprehension check ──────────────────────────────
      const coverCheck = buildCheck({
        questionHtml: `
          <div class="text-content">
            <h2>Quick Check</h2>
            <p>What should you do when an image appears on screen?</p>
          </div>`,
        choices: [
          'Judge whether the image is symmetric (press F or J)',
          'Try to memorise the order of images',
          'Count how many different images you see'
        ],
        correctIndex: 0,
        revealHtml: `
          <div class="text-content">
            <p>The correct answer is: <strong>judge whether the image is symmetric</strong>.</p>
            <p>Press <strong>${CONFIG.coverTask.symmetricLabel}</strong> if the image looks
               the same on both sides, or
               <strong>${CONFIG.coverTask.notSymmetricLabel}</strong> if it does not.</p>
            <p>Let's practice. Take your time on the first run.</p>
          </div>`
      });
      timeline.push(...coverCheck.nodes);

      // ── Step 2: 2AFC comprehension check ────────────────────────────────────
      const twoAFCCheck = buildCheck({
        questionHtml: `
          <div class="text-content">
            <h2>Quick Check</h2>
            <p>Occasionally you will be shown one image at the top and two images side
               by side below it. What are you being asked to judge?</p>
          </div>`,
        choices: [
          'Which of the two lower images is more likely to follow the top image',
          'Whether the top image is symmetric',
          'Which image you have seen the most times'
        ],
        correctIndex: 0,
        onBothFailed: function () {
          if (!coverCheck.passed()) {
            shouldAbort = true;
          }
        },
        canReveal: function () { return !shouldAbort; },
        revealHtml: `
          <div class="text-content">
            <p>The correct answer is:
               <strong>which of the two lower images is more likely to follow the top image</strong>.</p>
            <p>Press <strong>${CONFIG.twoAFC.leftLabel}</strong> for the left image, or
               <strong>${CONFIG.twoAFC.rightLabel}</strong> for the right image.</p>
            <p>Let's practice. No time limit yet.</p>
          </div>`
      });
      timeline.push(...twoAFCCheck.nodes);

      // Exit screen — shown if both comprehension checks failed twice each.
      timeline.push({
        timeline: [{
          type:     jsPsychHtmlButtonResponse,
          stimulus: `
            <div class="text-content">
              <p>Unfortunately, it looks like there may be some difficulty understanding the tasks.
                 The study has ended.</p>
              <p>Your completion code is:<br>
                 <strong style="font-size:1.3em;letter-spacing:2px;">${CONFIG.completionCodes.screenOutComprehension}</strong></p>
              <p>You will be redirected to Prolific automatically. If not, please return to
                 Prolific and enter the code above.</p>
              <p>If you have any questions, please contact the researcher.</p>
            </div>`,
          choices:  ['OK'],
          on_finish: function () {
            jatos.submitResultData(JSON.stringify({ exit_type: 'comprehension_fail' }));
            Utils.endStudyRoute(CONFIG.prolificScreenOutURL);
            jsPsych.endExperiment();
          }
        }],
        conditional_function: function () { return shouldAbort; }
      });

      // ── Practice loop ────────────────────────────────────────────────────────
      // Steps 3–7 repeat if the participant chooses "Repeat practice".
      // Comprehension checks are excluded so their closure state doesn't need to reset.
      let practiceRepeats = 0;
      const practiceLoop = {
        timeline: [

          // ── Step 3: Untimed cover task practice ───────────────────────────
          ...LearningPhase.createTimeline({
            walk: practiceWalk, jsPsych, block: 0, timed: false, giveFeedback: true
          }),

          // ── Step 4: Timed cover task practice ─────────────────────────────
          {
            type:     jsPsychHtmlButtonResponse,
            stimulus: `
              <div class="text-content">
                <h2>Now with a time limit</h2>
                <p>Good work! This time the images will disappear after
                   ${CONFIG.stimulusDuration / 1000} seconds, just like in the real task.</p>
                <p>Try to respond before each image disappears.</p>
                <p>Only your <strong>first keypress</strong> is recorded.
                   Pressing a second key will not change your response.</p>
              </div>`,
            choices: ['Start']
          },
          ...LearningPhase.createTimeline({
            walk: practiceWalk, jsPsych, block: 0, timed: true, giveFeedback: true
          }),

          // ── Step 5: Transition to 2AFC practice ───────────────────────────
          {
            type:     jsPsychHtmlButtonResponse,
            stimulus: `
              <div class="text-content">
                <h2>Part 2</h2>
                <p>Well done! Now let's practice the second part. No time limit.</p>
              </div>`,
            choices: ['Start']
          },

          // ── Step 5: Untimed 2AFC practice ─────────────────────────────────
          ...TestPhase.createTimeline({
            trials:            CONFIG.practiceTwoAFCTrials,
            jsPsych,
            block:             0,
            timed:             false,
            giveFeedback:      false,
            collectConfidence: true,
            group:             null,
            lookup:            null
          }),

          // ── Step 6: Timed 2AFC practice ───────────────────────────────────
          {
            type:     jsPsychHtmlButtonResponse,
            stimulus: `
              <div class="text-content">
                <h2>Now with a time limit</h2>
                <p>This time you will have ${CONFIG.testMaxResponseTime / 1000} seconds to respond
                   on each question, the same as in the real task.</p>
              </div>`,
            choices: ['Start']
          },
          ...TestPhase.createTimeline({
            trials:            CONFIG.practiceTwoAFCTrials,
            jsPsych,
            block:             0,
            timed:             true,
            giveFeedback:      false,
            warnOnTimeout:     true,
            collectConfidence: true,
            group:             null,
            lookup:            null
          }),

          // ── Step 7: Repeat or proceed ─────────────────────────────────────
          {
            type: jsPsychHtmlButtonResponse,
            stimulus: function () {
              return practiceRepeats < 1
                ? `<div class="text-content">
                     <h2>Practice complete</h2>
                     <p>Would you like to repeat the practice, or are you ready to start the main task?</p>
                   </div>`
                : `<div class="text-content">
                     <h2>Practice complete</h2>
                     <p>You are ready to start the main task.</p>
                   </div>`;
            },
            choices: function () {
              return practiceRepeats < 1
                ? ['Repeat practice', 'Start main task']
                : ['Start main task'];
            }
          }

        ],
        loop_function: function () {
          const last = jsPsych.data.get().last(1).values()[0];
          // Only repeat if "Repeat practice" (index 0) was chosen and limit not reached.
          if (last && last.response === 0 && practiceRepeats < 1) {
            practiceRepeats++;
            return true;
          }
          return false;
        }
      };

      timeline.push(practiceLoop);
      jsPsych.run(timeline);
    });
  </script>
</body>
</html>
