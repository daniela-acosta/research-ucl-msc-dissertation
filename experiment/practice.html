<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Practice</title>
  <link rel="stylesheet" href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css">
  <link rel="stylesheet" href="assets/style.css">
  <script src="jatos.js"></script>
</head>
<body>
  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.2.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-fullscreen@1.2.1"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-slider-response@1.1.3"></script>
  <script src="config.js"></script>
  <script src="components/utils.js"></script>
  <script src="components/learning-phase.js"></script>
  <script src="components/test-phase.js"></script>

  <script>
    jatos.onLoad(function () {
      const jsPsych = initJsPsych({
        on_finish: function () {
          jatos.startNextComponent();
        }
      });

      const practiceWalk = Utils.generatePracticeWalk(CONFIG.practiceWalkLength);

      // ── Comprehension-check builder ─────────────────────────────────────────
      // Returns { nodes: [...], passed: () => bool }
      // nodes: a loop node (up to 2 attempts) + a conditional reveal node.
      // passed() can be read by later code to check the outcome.
      //
      // onBothFailed (optional): called after 2nd failed attempt. Use to abort
      // the study when a second check also fails.
      function buildCheck({ questionHtml, choices, correctIndex, revealHtml, onBothFailed }) {
        let attempts = 0;
        let _passed  = false;

        const attemptTrial = {
          type:     jsPsychHtmlButtonResponse,
          stimulus: questionHtml,
          choices:  choices,
          on_finish: function (data) {
            attempts++;
            _passed = (data.response === correctIndex);
            if (!_passed && attempts >= 2 && onBothFailed) {
              onBothFailed();
            }
          }
        };

        // Show "not quite, try again" between attempt 1 and attempt 2 only.
        const incorrectFeedback = {
          timeline: [{
            type:           jsPsychHtmlKeyboardResponse,
            stimulus:       '<p class="feedback-incorrect">Not quite — please try again.</p>',
            choices:        'NO_KEYS',
            trial_duration: 1000
          }],
          conditional_function: function () {
            return !_passed && attempts < 2;
          }
        };

        const loopNode = {
          timeline:      [attemptTrial, incorrectFeedback],
          loop_function: function () { return !_passed && attempts < 2; }
        };

        // Reveal the correct answer only if both attempts failed.
        const revealNode = {
          timeline: [{
            type:     jsPsychHtmlButtonResponse,
            stimulus: revealHtml,
            choices:  ['OK, I understand']
          }],
          conditional_function: function () { return !_passed; }
        };

        return {
          nodes:  [loopNode, revealNode],
          passed: function () { return _passed; }
        };
      }

      // ── Build timeline ──────────────────────────────────────────────────────
      const timeline = [
        { type: jsPsychFullscreen, fullscreen_mode: true }
      ];

      // ── Step 1: Cover task comprehension check ──────────────────────────────
      const coverCheck = buildCheck({
        questionHtml: `
          <div class="text-content">
            <h2>Quick Check</h2>
            <p>What should you do when an image appears on screen?</p>
          </div>`,
        choices: [
          'Judge whether the image is symmetric (press F or J)',
          'Try to memorise the order of images',
          'Count how many different images you see'
        ],
        correctIndex: 0,
        revealHtml: `
          <div class="text-content">
            <p>The correct answer is: <strong>judge whether the image is symmetric</strong>.</p>
            <p>Press <strong>${CONFIG.coverTask.symmetricLabel}</strong> if the image looks
               the same on both sides, or
               <strong>${CONFIG.coverTask.notSymmetricLabel}</strong> if it does not.</p>
            <p>Let's practice — take your time on the first run.</p>
          </div>`
      });
      timeline.push(...coverCheck.nodes);

      // ── Step 2: Untimed cover task practice ─────────────────────────────────
      timeline.push(...LearningPhase.createTimeline({
        walk: practiceWalk, jsPsych, block: 0, timed: false, giveFeedback: true
      }));

      // ── Step 3: Timed cover task practice ───────────────────────────────────
      timeline.push({
        type:     jsPsychHtmlButtonResponse,
        stimulus: `
          <div class="text-content">
            <h2>Now with a time limit</h2>
            <p>Good work! This time the images will disappear after
               ${CONFIG.stimulusDuration / 1000} seconds — just like in the real task.</p>
            <p>Try to respond before each image disappears.</p>
          </div>`,
        choices: ['Start']
      });
      timeline.push(...LearningPhase.createTimeline({
        walk: practiceWalk, jsPsych, block: 0, timed: true, giveFeedback: true
      }));

      // ── Step 4: 2AFC comprehension check ────────────────────────────────────
      const twoAFCCheck = buildCheck({
        questionHtml: `
          <div class="text-content">
            <h2>Quick Check</h2>
            <p>Occasionally you will be shown one image at the top and two images side
               by side below it. What are you being asked to judge?</p>
          </div>`,
        choices: [
          'Which of the two lower images is more likely to follow the top image',
          'Whether the top image is symmetric',
          'Which image you have seen the most times'
        ],
        correctIndex: 0,
        onBothFailed: function () {
          if (!coverCheck.passed()) {
            jatos.abortStudy('Participant failed both comprehension checks after 2 attempts each.');
          }
        },
        revealHtml: `
          <div class="text-content">
            <p>The correct answer is:
               <strong>which of the two lower images is more likely to follow the top image</strong>.</p>
            <p>Press <strong>${CONFIG.twoAFC.leftLabel}</strong> for the left image, or
               <strong>${CONFIG.twoAFC.rightLabel}</strong> for the right image.</p>
            <p>Let's practice — no time limit yet.</p>
          </div>`
      });
      timeline.push(...twoAFCCheck.nodes);

      // ── Step 5: Untimed 2AFC practice ───────────────────────────────────────
      timeline.push(...TestPhase.createTimeline({
        trials:            CONFIG.practiceTwoAFCTrials,
        jsPsych,
        block:             0,
        timed:             false,
        giveFeedback:      true,
        collectConfidence: true,
        group:             null,
        lookup:            null
      }));

      // ── Step 6: Timed 2AFC practice ─────────────────────────────────────────
      timeline.push({
        type:     jsPsychHtmlButtonResponse,
        stimulus: `
          <div class="text-content">
            <h2>Now with a time limit</h2>
            <p>This time you will have ${CONFIG.testMaxResponseTime / 1000} seconds to respond
               on each question — the same as in the real task.</p>
          </div>`,
        choices: ['Start']
      });
      timeline.push(...TestPhase.createTimeline({
        trials:            CONFIG.practiceTwoAFCTrials,
        jsPsych,
        block:             0,
        timed:             true,
        giveFeedback:      true,
        collectConfidence: true,
        group:             null,
        lookup:            null
      }));

      jsPsych.run(timeline);
    });
  </script>
</body>
</html>
