<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Consent</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css"
    />
    <link rel="stylesheet" href="assets/style.css" />
    <script src="jatos.js"></script>
  </head>
  <body>
    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.2.0"></script>
    <script src="config.js"></script>
    <script src="components/utils.js"></script>

    <script>
      jatos.onLoad(async function () {
        const jsPsych = initJsPsych({
          on_finish: function () {
            jatos.startNextComponent();
          },
        });

        // Capture Prolific URL params and store in studySessionData
        const prolific = Utils.getProlificParams();
        jatos.studySessionData[CONFIG.sessionKeys.prolificPID] = prolific.pid;
        jatos.studySessionData[CONFIG.sessionKeys.studyID] = prolific.studyId;
        jatos.studySessionData[CONFIG.sessionKeys.sessionID] =
          prolific.sessionId;

        // Assign counterbalancing group via JATOS Batch Session
        const group = await Utils.assignGroup();
        jatos.studySessionData[CONFIG.sessionKeys.group] = group;

        // Assign stimulus config (3 or 4) and node→fractal mapping.
        // Done independently of group assignment.
        const stimulusConfig = Utils.assignStimulusConfig();
        const { map, typeMap } = Utils.assignStimuli(stimulusConfig);
        jatos.studySessionData[CONFIG.sessionKeys.stimulusConfig]  = stimulusConfig;
        jatos.studySessionData[CONFIG.sessionKeys.stimulusMap]     = map;
        jatos.studySessionData[CONFIG.sessionKeys.stimulusTypeMap] = typeMap;

        const timeline = [
          {
            type: jsPsychHtmlButtonResponse,
            stimulus: `
              <div class="text-content">
                <h2>Informed Consent</h2>
                <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Placeholder consent text.</p>
                <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor
                   incididunt ut labore et dolore magna aliqua.</p>
                <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Ut enim ad minim veniam,
                   quis nostrud exercitation ullamco laboris.</p>
                <p>By clicking <strong>I agree</strong> you confirm that you have read and understood
                   the above information and consent to participate.</p>
              </div>`,
            choices: ['I agree to participate', 'I do not wish to participate']
          },
          // Shown only if participant declined (response === 1).
          {
            timeline: [{
              type:     jsPsychHtmlButtonResponse,
              stimulus: `
                <div class="text-content">
                  <p>Thank you for your time. You have chosen not to participate.</p>
                  <p>Please <strong>return your submission on Prolific</strong> by clicking
                     "Stop without completing" on the Prolific website.</p>
                </div>`,
              choices:  ['OK'],
              on_finish: function () {
                if (typeof jatos !== 'undefined') {
                  jatos.abortStudy('Participant declined consent.');
                }
                jsPsych.endExperiment();
              }
            }],
            conditional_function: function () {
              const last = jsPsych.data.get().last(1).values()[0];
              return last && last.response === 1;
            }
          }
        ];

        jsPsych.run(timeline);
      });
    </script>
  </body>
</html>
